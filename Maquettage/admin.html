<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rabat Active Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        accent: '#f97316'
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 font-inter">
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-city text-primary text-2xl"></i>
                    <h1 class="text-2xl font-bold text-primary">RABAT ACTIVE BLOG</h1>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="text-gray-700 font-medium hover:text-accent transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i> Back to Home
                    </a>
                    <button onclick="logout()" class="bg-accent hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-300">
                        <i class="fas fa-sign-out-alt mr-2"></i> Logout
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-primary uppercase">Admin Dashboard</h2>
                <button onclick="showAddArticleForm()" class="bg-accent hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-300">
                    <i class="fas fa-plus mr-2"></i> Add New Article
                </button>
            </div>

            <!-- Add/Edit Form -->
            <div id="articleForm" class="hidden mb-8 p-6 bg-gray-50 rounded-lg">
                <h3 class="text-xl font-bold text-primary mb-4 uppercase">Add/Edit Article</h3>
                <form onsubmit="saveArticle(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <input type="text" id="formTitle" placeholder="Article Title" required 
                            class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        <input type="text" id="formAuthor" placeholder="Author Name" required 
                            class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <input type="text" id="formImage" placeholder="Image URL" required 
                        class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    <textarea id="formDescription" placeholder="Short Description" required rows="3"
                        class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    <textarea id="formContent" placeholder="Full Article Content" required rows="6"
                        class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    <input type="text" id="formTags" placeholder="Tags (comma separated)" required 
                        class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    <div class="flex gap-4">
                        <button type="submit" class="bg-primary hover:bg-blue-900 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-300">
                            Save Article
                        </button>
                        <button type="button" onclick="hideArticleForm()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-300">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Articles Table -->
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-primary text-white">
                        <tr>
                            <th class="px-4 py-3 text-left">Title</th>
                            <th class="px-4 py-3 text-left">Author</th>
                            <th class="px-4 py-3 text-left">Description</th>
                            <th class="px-4 py-3 text-left">Tags</th>
                            <th class="px-4 py-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminArticlesTable" class="divide-y divide-gray-200">
                        <!-- Articles will be dynamically loaded -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white mt-16">
        <div class="container mx-auto px-4 py-8 text-center text-gray-300">
            <p>&copy; 2025 Rabat Active Blog. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let articles = JSON.parse(localStorage.getItem('articles')) || [];
        let editingId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminTable();
        });

        // Load Admin Table
        function loadAdminTable() {
            const tbody = document.getElementById('adminArticlesTable');
            
            if (articles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-3 text-center text-gray-600">No articles yet. Create your first article!</td></tr>';
                return;
            }
            
            tbody.innerHTML = articles.map(article => `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium">${article.title}</td>
                    <td class="px-4 py-3">${article.author}</td>
                    <td class="px-4 py-3 text-sm">${article.description.substring(0, 50)}...</td>
                    <td class="px-4 py-3">
                        <div class="flex flex-wrap gap-1">
                            ${article.tags.map(tag => `<span class="bg-gray-200 text-xs px-2 py-1 rounded">${tag}</span>`).join('')}
                        </div>
                    </td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="editArticle(${article.id})" class="text-primary hover:text-blue-900 mr-3 transition-colors">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteArticle(${article.id})" class="text-red-600 hover:text-red-800 transition-colors">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Show Add Article Form
        function showAddArticleForm() {
            editingId = null;
            document.getElementById('articleForm').classList.remove('hidden');
            document.getElementById('formTitle').value = '';
            document.getElementById('formAuthor').value = '';
            document.getElementById('formImage').value = '';
            document.getElementById('formDescription').value = '';
            document.getElementById('formContent').value = '';
            document.getElementById('formTags').value = '';
            document.getElementById('formTitle').focus();
        }

        // Hide Article Form
        function hideArticleForm() {
            document.getElementById('articleForm').classList.add('hidden');
            editingId = null;
        }

        // Edit Article
        function editArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;

            editingId = id;
            document.getElementById('articleForm').classList.remove('hidden');
            document.getElementById('formTitle').value = article.title;
            document.getElementById('formAuthor').value = article.author;
            document.getElementById('formImage').value = article.image;
            document.getElementById('formDescription').value = article.description;
            document.getElementById('formContent').value = article.content;
            document.getElementById('formTags').value = article.tags.join(', ');
            
            window.scrollTo(0, 0);
        }

        // Save Article
        function saveArticle(event) {
            event.preventDefault();
            
            const articleData = {
                title: document.getElementById('formTitle').value,
                author: document.getElementById('formAuthor').value,
                image: document.getElementById('formImage').value,
                description: document.getElementById('formDescription').value,
                content: document.getElementById('formContent').value,
                tags: document.getElementById('formTags').value.split(',').map(t => t.trim()),
                date: new Date().toISOString().split('T')[0]
            };

            if (editingId) {
                const index = articles.findIndex(a => a.id === editingId);
                articles[index] = { ...articles[index], ...articleData };
            } else {
                const newId = articles.length > 0 ? Math.max(...articles.map(a => a.id)) + 1 : 1;
                articles.push({ id: newId, ...articleData });
            }

            localStorage.setItem('articles', JSON.stringify(articles));
            hideArticleForm();
            loadAdminTable();
            alert(editingId ? 'Article updated successfully!' : 'Article created successfully!');
        }

        // Delete Article
        function deleteArticle(id) {
            if (confirm('Are you sure you want to delete this article?')) {
                articles = articles.filter(a => a.id !== id);
                localStorage.setItem('articles', JSON.stringify(articles));
                loadAdminTable();
                alert('Article deleted successfully!');
            }
        }

        // Logout
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
